services:
  # ── Web API (Express + Socket.IO) ──
  - type: web
    name: vedaai-api
    env: node
    region: oregon
    plan: starter
    # Use migrate:deploy (not raw `prisma migrate deploy`) so P3009 failed
    # migrations are cleared and DIRECT_URL is used (pooler hangs on locks).
    buildCommand: npm install && npm run migrate:deploy --workspace=apps/backend && npm run build --workspace=apps/backend
    startCommand: cd apps/backend && node dist/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_WORKER_MODE
        value: web
      - key: ENABLE_BACKGROUND_WORKERS
        value: "true"
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: https://vedaai-ed.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_BULLMQ_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STORAGE_TYPE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

  # ── Background Worker (BullMQ) ──
  - type: worker
    name: vedaai-worker
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build --workspace=apps/backend
    startCommand: cd apps/backend && node dist/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_WORKER_MODE
        value: worker
      - key: ENABLE_BACKGROUND_WORKERS
        value: "true"
      - key: PORT
        value: "5001"
      - key: FRONTEND_URL
        value: https://vedaai-ed.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_BULLMQ_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STORAGE_TYPE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
